<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desktop Commander</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; }
    main { max-width: 760px; margin: 0 auto; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: 25px; }
    h2 { font-size: 17px; margin: 24px 0 10px; }
    .muted { color: #68758b; }
    .card { background: #fff; border: 1px solid #dfe6f0; border-radius: 12px; padding: 24px; box-shadow: 0 6px 22px #1c355414; }
    .row { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid #edf0f5; }
    .row:last-child { border-bottom: 0; }
    .label { color: #68758b; }
    #status { font-weight: 650; }
    .code { font: 700 25px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .12em; color: #116bb5; }
    .notice { margin-top: 18px; padding: 14px 16px; border-radius: 8px; background: #eef7ff; color: #214a6b; line-height: 1.55; }
    a.button, button { display: inline-block; margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 7px; background: #0879c9; color: white; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .error { color: #a53a2b; }
    .shares { max-height: 240px; overflow: auto; border: 1px solid #edf0f5; border-radius: 8px; padding: 8px 14px; }
    .share { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #edf0f5; }
    .share:last-child { border-bottom: 0; }
    .share small { display: block; color: #68758b; overflow-wrap: anywhere; }
    .switch { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
    .hint { margin: 8px 0; color: #68758b; font-size: 13px; line-height: 1.55; }
    @media (max-width: 560px) { body { padding: 18px; } .card { padding: 18px; } .row { display: block; } .label { display: block; margin-bottom: 6px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Desktop Commander</h1>
      <div class="muted">NAS 远程设备授权、共享目录与服务设置</div>
    </header>
    <section class="card" aria-live="polite">
      <div class="row"><span class="label">服务状态</span><span id="status">正在读取…</span></div>
      <div class="row" id="codeRow" hidden><span class="label">设备授权码</span><span class="code" id="code"></span></div>
      <div class="row" id="expiryRow" hidden><span class="label">授权码有效期</span><span id="expiry"></span></div>
      <div class="notice" id="message">页面会自动检测设备授权请求。检测到授权链接后，将自动在此窗口打开官方验证页面。</div>
      <a class="button" id="manualLink" href="#" target="_blank" rel="noopener" hidden>手动打开官方授权页面</a>

      <h2>共享目录访问</h2>
      <div class="muted" id="shareState">正在读取共享目录…</div>
      <div class="shares" id="shares"></div>
      <p class="hint">这里选择的目录用于文件读写工具；系统内置 workspace 始终保留。Shell 工具以 root 执行，可访问 NAS 系统路径。</p>

      <div class="switch"><input type="checkbox" id="autostart" checked><label for="autostart">NAS 开机时自动启动 Desktop Commander</label></div>
      <p class="hint">关闭后只影响下次 NAS 开机；仍可在套件中心手动启动。</p>
      <button id="save">保存设置</button>
      <span id="saveState" class="hint" role="status"></span>
    </section>
  </main>
  <script>
    (() => {
      const el = id => document.getElementById(id);
      const status=el('status'), codeRow=el('codeRow'), code=el('code'), expiryRow=el('expiryRow'), expiry=el('expiry');
      const message=el('message'), manualLink=el('manualLink'), shares=el('shares'), shareState=el('shareState');
      let synoToken='', loadedShares=[];
      async function getSynoToken(){
        if(synoToken)return synoToken;
        try{const r=await fetch('/webman/login.cgi',{cache:'no-store',credentials:'same-origin'});const d=await r.json();if(d&&d.result==='success'&&typeof d.SynoToken==='string')synoToken=d.SynoToken;}catch{}
        return synoToken;
      }
      function trustedUrl(value){try{const u=new URL(value);return u.protocol==='https:'&&(u.hostname==='desktopcommander.app'||u.hostname.endsWith('.desktopcommander.app'))?u.href:'';}catch{return '';}}
      async function refreshAuth(){
        try{
          const token=await getSynoToken();const r=await fetch(token?`auth.cgi?SynoToken=${encodeURIComponent(token)}`:'auth.cgi',{cache:'no-store',credentials:'same-origin'});const d=await r.json();
          if(d.state==='pending'&&Date.now()<Number(d.expiresAt)){
            status.textContent='等待设备授权';code.textContent=String(d.userCode||'');codeRow.hidden=!d.userCode;
            const seconds=Math.max(0,Math.ceil((Number(d.expiresAt)-Date.now())/1000));expiry.textContent=`${Math.floor(seconds/60)} 分 ${seconds%60} 秒`;expiryRow.hidden=false;
            const url=trustedUrl(d.verificationUrl);
            if(url){manualLink.href=url;manualLink.hidden=false;message.textContent='检测到官方设备授权请求，正在打开验证页面。';}
            else {message.textContent='授权链接未通过官方域名校验，已阻止跳转。';message.classList.add('error');}
          }else if(d.state==='authorized'){status.textContent='已授权';codeRow.hidden=true;expiryRow.hidden=true;manualLink.hidden=true;message.textContent='设备授权已完成，Desktop Commander 正在连接。';}
          else if(d.state==='failed'){status.textContent='授权失败或已过期';codeRow.hidden=true;expiryRow.hidden=true;message.textContent='请在套件中心重启 Desktop Commander 以重新发起授权。';}
          else {status.textContent='等待授权请求';codeRow.hidden=true;expiryRow.hidden=true;message.textContent='服务连接后，本页面会自动检测授权请求。';}
        }catch{status.textContent='暂时无法读取状态';message.textContent='请确认套件已启动，并保持 DSM 管理员登录状态。页面会自动重试。';}
      }
      async function loadSettings(){
        try{
          const r=await fetch('settings.cgi',{cache:'no-store',credentials:'same-origin'});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'读取设置失败');
          loadedShares=d.shares||[];const allowed=new Set(d.allowedDirectories||[]);el('autostart').checked=!!d.autostart;shares.replaceChildren();
          if(!loadedShares.length)shareState.textContent='未发现共享目录。可稍后刷新页面重试。';
          else shareState.textContent='勾选 Desktop Commander 文件工具可以访问的共享目录。';
          for(const share of loadedShares){const label=document.createElement('label');label.className='share';const box=document.createElement('input');box.type='checkbox';box.value=share.path;box.checked=allowed.has(share.path);const text=document.createElement('span');text.textContent=share.name;const path=document.createElement('small');path.textContent=share.path;text.append(path);label.append(box,text);shares.append(label);}
        }catch(e){shareState.textContent=e.message||'无法加载设置，请确认已使用 DSM 管理员登录。';shareState.classList.add('error');}
      }
      el('save').addEventListener('click',async()=>{
        const button=el('save'),out=el('saveState');button.disabled=true;out.classList.remove('error');out.textContent='正在保存…';
        try{
          const selected=[...shares.querySelectorAll('input:checked')].map(x=>x.value);
          const response=await fetch('settings.cgi',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-SynoToken':await getSynoToken()},body:JSON.stringify({sharedDirectories:selected,autostart:el('autostart').checked})});
          const data=await response.json();if(!response.ok||data.error)throw new Error(data.error||'保存失败');out.textContent='设置已保存。';
        }catch(e){out.textContent=e.message||'保存失败';out.classList.add('error');}
        finally{button.disabled=false;}
      });
      refreshAuth();loadSettings();setInterval(refreshAuth,4000);
    })();
  </script>
</body>
</html>
